<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Generator</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: white; padding: 40px; text-align: center; }
  .previews { display: flex; gap: 30px; justify-content: center; margin: 30px 0; }
  canvas { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
  button { padding: 15px 30px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px; font-weight: bold; }
  button:hover { background: #4338ca; }
  h2 { color: #a5b4fc; }
</style>
</head>
<body>

<h2>Генератор иконок marge-PDF</h2>
<p>Нажми кнопки ниже, чтобы скачать новые PNG файлы</p>

<div class="previews">
  <div>
    <p>192×192</p>
    <canvas id="c192" width="192" height="192"></canvas>
  </div>
  <div>
    <p>512×512</p>
    <canvas id="c512" width="512" height="512"></canvas>
  </div>
  <div>
    <p>Maskable 512×512</p>
    <canvas id="cMask" width="512" height="512"></canvas>
  </div>
</div>

<div>
  <button onclick="download('c192', 'icon-192.png')">⬇️ Скачать icon-192.png</button>
  <button onclick="download('c512', 'icon-512.png')">⬇️ Скачать icon-512.png</button>
  <button onclick="download('cMask', 'icon-512-maskable.png')">⬇️ Скачать icon-512-maskable.png</button>
</div>

<script>
const svgString = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <rect x="140" y="160" width="220" height="260" rx="16" fill="rgba(255,255,255,0.15)"/>
  <rect x="160" y="140" width="220" height="260" rx="16" fill="rgba(255,255,255,0.3)"/>
  <path d="M180 120 L300 120 L280 160 L320 160 L270 200 L310 200 L260 240 L300 240 L270 280 L310 280 L280 320 L320 320 L300 360 L180 360 Z" fill="#ffffff"/>
</svg>
`;

const img = new Image();
const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
const url = URL.createObjectURL(svgBlob);

img.onload = function() {
  drawCanvas('c192', 192, 0);
  drawCanvas('c512', 512, 0);
  drawCanvas('cMask', 512, 0.15); // 15% отступ для maskable
};

img.src = url;

function drawCanvas(id, size, paddingPercent) {
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  
  // Для maskable — заливаем фон градиентом
  if (paddingPercent > 0) {
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#6366f1');
    grad.addColorStop(1, '#06b6d4');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    
    // Рисуем иконку в центре с отступом
    const pad = size * paddingPercent;
    ctx.drawImage(img, pad, pad, size - pad*2, size - pad*2);
  } else {
    ctx.drawImage(img, 0, 0, size, size);
  }
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
