<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка офлайн-кэша</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:40px auto}pre{white-space:pre-wrap}button{padding:15px}</style><h1>Офлайн-кэш</h1><button id="run">Проверить кэш</button><pre id="out"></pre><script>document.getElementById('run').onclick=async()=>{const names=await caches.keys();const name=names.find(x=>x==='marge-pdf-pro-v4');const c=name?await caches.open(name):null;const expected=await (await fetch('offline-assets.json')).json();const missing=[];for(const asset of expected)if(!c||!await c.match(asset,{ignoreSearch:true}))missing.push(asset);document.getElementById('out').textContent=JSON.stringify({status:missing.length?'failed':'passed',controller:!!navigator.serviceWorker.controller,cache:name,assets:expected.length,missing},null,2);};</script></html>
