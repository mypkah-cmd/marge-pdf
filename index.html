<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marge PDF — объединение PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #1a202c;
    text-align: center;
  }
  .subtitle {
    color: #718096;
    font-size: 14px;
    text-align: center;
    margin-bottom: 28px;
  }
  input[type="password"], input[type="file"] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: #667eea;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102,126,234,0.4);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .hidden { display: none; }
  .error {
    color: #e53e3e;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
  }
  .info {
    color: #38a169;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
  }
  .drop-zone {
    border: 2px dashed #cbd5e0;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    color: #718096;
    margin-bottom: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #667eea;
    background: #f7fafc;
  }
  .file-list {
    list-style: none;
    margin-bottom: 16px;
    max-height: 200px;
    overflow-y: auto;
  }
  .file-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #f7fafc;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .file-list .remove {
    background: none;
    color: #e53e3e;
    border: none;
    font-size: 18px;
    cursor: pointer;
    width: auto;
    padding: 0 6px;
    font-weight: bold;
  }
  .file-list .remove:hover {
    transform: none;
    box-shadow: none;
    color: #c53030;
  }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="container" id="loginScreen">
  <h1>🔒 Вход</h1>
  <p class="subtitle">Введите пароль для доступа</p>
  <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
  <button id="loginBtn">Войти</button>
  <div class="error hidden" id="loginError">Неверный пароль</div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div class="container hidden" id="appScreen">
  <h1>📄 Marge PDF</h1>
  <p class="subtitle">Объедините несколько PDF в один</p>

  <div class="drop-zone" id="dropZone">
    Перетащите PDF сюда или нажмите для выбора
    <input type="file" id="fileInput" accept="application/pdf" multiple class="hidden">
  </div>

  <ul class="file-list" id="fileList"></ul>

  <button id="mergeBtn" disabled>Объединить и скачать</button>
  <div class="info hidden" id="statusMsg"></div>
</div>

<script>
/* ============================================================
   ⚙️ НАСТРОЙКИ — ИЗМЕНИТЕ ПАРОЛЬ ЗДЕСЬ
   ============================================================ */
const PASSWORD = "Bucher";   // ← ваш пароль

/* ============================================================
   ЛОГИКА ВХОДА
   ============================================================ */
const loginScreen = document.getElementById('loginScreen');
const appScreen   = document.getElementById('appScreen');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

function tryLogin() {
  if (passwordInput.value === PASSWORD) {
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    // запомнить сессию
    sessionStorage.setItem('pdf_authed', '1');
  } else {
    loginError.classList.remove('hidden');
    passwordInput.value = '';
    passwordInput.focus();
  }
}

loginBtn.addEventListener('click', tryLogin);
passwordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

// авто-вход в рамках сессии
if (sessionStorage.getItem('pdf_authed') === '1') {
  loginScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
}

/* ============================================================
   ЛОГИКА ОБЪЕДИНЕНИЯ PDF
   ============================================================ */
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList  = document.getElementById('fileList');
const mergeBtn  = document.getElementById('mergeBtn');
const statusMsg = document.getElementById('statusMsg');

let files = []; // массив File объектов

// клик по зоне → открыть диалог
dropZone.addEventListener('click', () => fileInput.click());

// drag & drop
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles([...e.dataTransfer.files]);
});

// выбор через input
fileInput.addEventListener('change', e => {
  addFiles([...e.target.files]);
  fileInput.value = '';
});

function addFiles(newFiles) {
  const pdfs = newFiles.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  files.push(...pdfs);
  renderList();
}

function renderList() {
  fileList.innerHTML = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>📎 ${f.name}</span>`;
    const btn = document.createElement('button');
    btn.className = 'remove';
    btn.textContent = '×';
    btn.title = 'Удалить';
    btn.addEventListener('click', () => {
      files.splice(i, 1);
      renderList();
    });
    li.appendChild(btn);
    fileList.appendChild(li);
  });
  mergeBtn.disabled = files.length < 2;
  if (files.length < 2 && files.length > 0) {
    showStatus('Добавьте ещё минимум один PDF', false);
  } else {
    hideStatus();
  }
}

function showStatus(text, ok = true) {
  statusMsg.textContent = text;
  statusMsg.className = 'info';
  statusMsg.style.color = ok ? '#38a169' : '#dd6b20';
  statusMsg.classList.remove('hidden');
}
function hideStatus() {
  statusMsg.classList.add('hidden');
}

// ОБЪЕДИНЕНИЕ
mergeBtn.addEventListener('click', async () => {
  if (files.length < 2) return;
  mergeBtn.disabled = true;
  showStatus('Обработка...');

  try {
    const { PDFDocument } = PDFLib;
    const mergedPdf = await PDFDocument.create();

    for (const file of files) {
      const bytes = await file.arrayBuffer();
      const pdf = await PDFDocument.load(bytes, { ignoreEncryption: true });
      const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      pages.forEach(p => mergedPdf.addPage(p));
    }

    const mergedBytes = await mergedPdf.save();
    const blob = new Blob([mergedBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    showStatus('✅ Готово! Файл скачан.');
  } catch (err) {
    console.error(err);
    showStatus('❌ Ошибка: ' + err.message, false);
  } finally {
    mergeBtn.disabled = false;
  }
});
</script>
</body>
</html>
